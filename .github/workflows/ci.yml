name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          node --version

      - name: Build every target
        run: swift build

      - name: Swift checks and web tests
        run: scripts/test.sh

      - name: Deploy rollback checks
        run: scripts/check-deploy-restore.sh

  web:
    name: web tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Web tests
        run: |
          node --version
          node --test web/tests/*.test.js

  bundle:
    name: app bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install livekit-server
        run: brew install livekit

      - name: Build Porthole.app
        run: scripts/bundle.sh

      - name: Check the app bundle
        run: scripts/check-bundle.sh
