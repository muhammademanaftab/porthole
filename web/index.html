<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Porthole</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --panel: #ffffff; --well: #ececf0; --ink: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6;
    --line: rgba(0,0,0,.1); --accent: #0a84ff; --accent-soft: rgba(10,132,255,.12); --warn: #ff9f0a; --bad: #ff453a; --ok: #30d158;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
    --glass: rgba(246,246,248,.78);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --panel: #2c2c2e; --well: #232325; --ink: #f5f5f7; --muted: #98989d; --faint: #636366;
      --line: rgba(255,255,255,.1); --accent-soft: rgba(10,132,255,.22); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --glass: rgba(30,30,32,.78);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg { flex: none; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.2; }
  .brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .search { position: relative; width: min(260px, 40vw); }
  .search input { width: 100%; padding: 6px 10px 6px 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); outline: none; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--muted); }
  .icon-btn:hover, .icon-btn:focus-visible { color: var(--ink); border-color: var(--accent); outline: none; }
  .btn { text-decoration: none; display: inline-block; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; }
  .btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #picker { min-height: 100%; display: flex; flex-direction: column; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; padding: 20px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); max-width: 1200px; width: 100%; margin: 0 auto; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 8px; border-radius: 14px; color: inherit; text-decoration: none; border: 2px solid transparent; transition: background .15s, border-color .15s; }
  .card:hover { background: var(--accent-soft); }
  .card:focus-visible { outline: none; border-color: var(--accent); background: var(--accent-soft); }
  .shot { position: relative; aspect-ratio: 16 / 10; border-radius: 9px; background: var(--well); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; }
  .shot img.thumb { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
  .shot img.big { width: 56px; height: 56px; opacity: .9; }
  .shot .glyph { font-size: 52px; line-height: 1; opacity: .85; }
  .meta { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 2px; }
  .meta img { width: 28px; height: 28px; flex: none; }
  .meta .blank { width: 28px; height: 28px; flex: none; border-radius: 7px; background: var(--well); }
  .meta div { min-width: 0; }
  .meta b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .notice { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 48px 24px; }
  .notice h2 { margin: 8px 0 0; font-size: 18px; font-weight: 600; }
  .notice p { margin: 0; max-width: 380px; color: var(--muted); }
  .notice .btn { margin-top: 12px; }
  .notice .glyph { font-size: 40px; line-height: 1; color: var(--faint); }
  .notice.locked .glyph { color: var(--warn); }
  .notice.error .glyph { color: var(--bad); }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--muted); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pwform { margin: 8vh auto 0; width: min(360px, calc(100% - 32px)); padding: 24px; border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); text-align: center; display: grid; gap: 12px; }
  #pwform[hidden] { display: none; }
  #pwform h2 { margin: 0; font-size: 17px; }
  #pwform p { margin: 0; color: var(--muted); font-size: 13px; }
  #pwform input { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); outline: none; text-align: center; }
  #pwform input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 5px; vertical-align: 1px; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  #stage { position: fixed; inset: 0; background: #000; display: none; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; outline: none; touch-action: none; }
  #bar { position: fixed; z-index: 3; top: 8px; left: 50%; transform: translate(-50%, 0); display: flex; align-items: center; gap: 6px; max-width: calc(100% - 16px); padding: 5px 6px 5px 12px; border-radius: 12px; color: #f5f5f7; background: rgba(30,30,32,.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 6px 24px rgba(0,0,0,.4); transition: opacity .25s, transform .25s; font-size: 12px; }
  #bar.hidden { opacity: 0; transform: translate(-50%, -140%); pointer-events: none; }
  #bar a { color: inherit; text-decoration: none; opacity: .75; white-space: nowrap; }
  #bar a:hover { opacity: 1; }
  #wtitle { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding: 0 6px; }
  #route { opacity: .6; white-space: nowrap; padding-right: 4px; }
  #bar .sep { width: 1px; height: 16px; background: rgba(255,255,255,.2); }
  #bar button { padding: 4px 10px; border-radius: 7px; border: 0; background: rgba(255,255,255,.1); color: inherit; cursor: pointer; white-space: nowrap; font-size: 12px; }
  #bar button:hover, #bar button:focus-visible { background: rgba(255,255,255,.2); outline: none; }
  #snd, #clip, #ask { display: none; }
  #ask { background: var(--accent) !important; }
  #ask:disabled { opacity: .7; cursor: default; }
  #snd.ask { background: var(--accent); }
  #overlay { position: fixed; inset: 0; z-index: 2; display: none; place-items: center; background: rgba(0,0,0,.55); }
  #overlay.on { display: grid; }
  #overlay .hud { width: min(320px, calc(100% - 32px)); padding: 24px; border-radius: 16px; background: rgba(36,36,38,.9); color: #f5f5f7; text-align: center; display: grid; justify-items: center; gap: 8px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  #overlay h2 { margin: 6px 0 0; font-size: 15px; }
  #overlay p { margin: 0; color: #a1a1a6; font-size: 12px; }
  #overlay .spinner { border-color: rgba(255,255,255,.15); border-top-color: #f5f5f7; }
  #overlay .actions { display: flex; gap: 8px; margin-top: 8px; }
  #overlay .actions[hidden] { display: none; }
  #overlay .btn { background: rgba(255,255,255,.12); border-color: transparent; color: #f5f5f7; }
  #overlay .btn.primary { background: var(--accent); }
  #toast { position: fixed; z-index: 4; left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(30,30,32,.88); color: #f5f5f7; padding: 6px 14px; border-radius: 999px; font-size: 12px; pointer-events: none; transition: opacity .4s; opacity: 0; max-width: calc(100% - 32px); text-align: center; }
  @media (max-width: 560px) {
    .brand small { display: none; }
    #list { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    #bar .hint { display: none; }
  }
</style>
</head>
<body>
<div id="picker">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f86f0"/><stop offset="1" stop-color="#0b2a6f"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9e4ff"/><stop offset="1" stop-color="#2d7fe0"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g1)"/><circle cx="32" cy="32" r="21" fill="#dde3ea"/><circle cx="32" cy="32" r="15" fill="url(#g2)"/><rect x="22.5" y="25" width="19" height="14" rx="2.5" fill="#fff"/><rect x="22.5" y="25" width="19" height="3.5" fill="#e9eef4"/></svg>
      <div><h1>Porthole</h1><small id="status"><span class="dot"></span>Connecting…</small></div>
    </div>
    <div class="spacer"></div>
    <label class="search" id="searchbox" hidden><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search windows" autocomplete="off" aria-label="Search windows"></label>
    <button class="icon-btn" id="refresh" title="Refresh (R)" aria-label="Refresh" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.5 1.5v3h-3"/></svg></button>
  </header>
  <form id="pwform" hidden><h2>Enter the host password</h2><p id="pwhint">It is in the Porthole Host menu on the Mac, under Copy Password.</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn primary">Connect</button></form>
  <div class="notice" id="notice"><div class="spinner"></div><h2>Connecting…</h2><p>Asking the host for its windows.</p></div>
  <div id="list"></div>
</div>
<div id="stage">
  <video id="video" autoplay muted playsinline tabindex="0"></video>
  <div id="bar" class="hidden">
    <a id="back" href="?" title="All windows on this Mac">&#8592; Windows</a><span class="sep"></span>
    <span id="wtitle">Porthole</span>
    <span id="route" hidden></span>
    <button id="snd" title="Turn the app's sound on or off in this tab">Sound on</button>
    <button id="clip" title="Copy the Mac's clipboard to this computer">Copy here</button>
    <button id="ask" title="Ask the Mac's owner to let you type and click in this window">Ask to Control</button>
    <button id="fit" title="Resize the window on the Mac to fill this tab">Fit to tab</button>
  </div>
  <div id="overlay"><div class="hud"><div class="spinner" id="ospin"></div><h2 id="otitle"></h2><p id="otext"></p><div class="actions" id="oacts" hidden><a class="btn" id="oback" href="?">All Windows</a><button class="btn primary" id="oretry">Try Again</button></div></div></div>
</div>
<div id="toast"></div>
<script src="livekit-client.umd.min.js"></script>
<script src="porthole-core.js"></script>
<script>
const LK = window.LivekitClient;
const params = new URLSearchParams(location.search);
const winId = params.get('win') ? Number(params.get('win')) : null;
const share = params.get('share');
let guest = null, controlling = false, asking = false;
const $ = (id) => document.getElementById(id);
const isMac = /Mac/.test(navigator.platform);
let room, hostP, listed = false, opened = false, firstFrame = false;
let windows = [], query = '', listError = null, loaded = false, link = { text: 'Connecting…', state: '' };
const icons = new Map(), thumbs = new Map();

const PC = window.PortholeCore;
PC.ensureRandomUUID(window.crypto);
const mods = (e) => PC.mods(e, isMac);

function send(msg, reliable = true) {
  const data = new TextEncoder().encode(JSON.stringify(msg));
  room.localParticipant.publishData(data, { reliable, topic: 'porthole', destinationIdentities: ['host'] });
}

let connectedAt = 0;
function linkLost(reconnecting) {
  const text = reconnecting ? 'Lost the connection to the host. Reconnecting…' : 'Disconnected from the host. Reload to connect again.';
  setLink(reconnecting ? 'Reconnecting…' : 'Disconnected', 'bad');
  if (winId) overlay(reconnecting ? 'reconnecting' : 'disconnected');
  else { listError = text; render(); }
}

function scheduleReconnect(reason, upForMs) {
  const attempt = PC.nextReconnectAttempt(sessionStorage.getItem('reconnects'), upForMs);
  const wait = PC.reconnectDelay(reason, attempt);
  if (wait === null) { sessionStorage.removeItem('reconnects'); linkLost(false); return; }
  sessionStorage.setItem('reconnects', String(attempt));
  linkLost(true);
  setTimeout(async () => {
    if (await PC.hostReachable(fetch)) location.reload(); else scheduleReconnect(0, 0);
  }, wait);
}

function setStatus(text, state) {
  $('status').innerHTML = `<span class="dot ${state || ''}"></span>`;
  $('status').append(text);
}

function setLink(text, state) {
  link = text === null ? null : { text, state };
  setStatus(link ? link.text : 'Connected', link ? link.state : 'ok');
  if (!link && !winId) render();
}

const live = () => room && room.state === 'connected';

function imageHandler(store, type, after) {
  return async (reader, info) => {
    if (info.identity !== 'host') return;
    const id = PC.streamWindow(reader.info.attributes);
    if (id === null) return;
    const chunks = await reader.readAll();
    const old = store.get(id);
    store.set(id, URL.createObjectURL(new Blob(chunks, { type })));
    if (old) URL.revokeObjectURL(old);
    after(id);
  };
}

function guestCid() {
  let cid = sessionStorage.getItem('cid');
  if (!cid) { cid = PC.clientId(window.crypto); sessionStorage.setItem('cid', cid); }
  return cid;
}

async function connect(pw) {
  setLink('Connecting…');
  const r = await fetch(PC.tokenPath(share ? { share, cid: guestCid() } : { pw }));
  if (share && r.status === 403) {
    const why = PC.linkRefusal(r.status, await r.json().catch(() => null)) || 'This link was refused.';
    sessionStorage.removeItem('reconnects');
    setLink('Link not valid', 'bad');
    listError = why;
    if (winId) { $('picker').style.display = 'none'; $('stage').style.display = 'block'; overlay('failed', why); $('oretry').hidden = true; }
    else render();
    return;
  }
  if (r.status === 403) { sessionStorage.removeItem('reconnects'); showPassword('That password was refused. Try again.'); return; }
  if (!r.ok) throw new Error(`the host answered HTTP ${r.status}`);
  const reply = await r.json();
  const { url, token } = reply;
  if (share) {
    guest = reply.guest || {};
    controlling = !!guest.control;
    if (guest.window && !winId) { location.replace(PC.guestWindowLink(share, guest.window)); return; }
    $('back').href = PC.guestPickerLink(share);
    if (guest.window) { $('back').hidden = true; $('oback').hidden = true; }
  } else {
    sessionStorage.setItem('pw', pw);
    $('back').href = PC.pickerLink(pw);
  }
  $('oback').href = $('back').href;
  showGuest();
  room = new LK.Room({ adaptiveStream: false, dynacast: false });
  room.on(LK.RoomEvent.DataReceived, onData);
  room.registerTextStreamHandler(PC.CLIP_TOPIC, async (reader, info) => {
    if (info.identity !== 'host') return;
    clipFromHost(await reader.readAll());
  });
  room.registerByteStreamHandler(PC.THUMB_TOPIC, imageHandler(thumbs, 'image/jpeg', paintCard));
  room.registerByteStreamHandler(PC.ICON_TOPIC, imageHandler(icons, 'image/png', iconArrived));
  room.on(LK.RoomEvent.AudioPlaybackStatusChanged, showSound);
  room.on(LK.RoomEvent.Reconnecting, () => { setLink('Reconnecting…'); if (winId) overlay('reconnecting'); });
  room.on(LK.RoomEvent.Reconnected, () => { setLink(null); if (winId) overlay(firstFrame ? null : 'opening'); });
  room.on(LK.RoomEvent.Disconnected, (reason) => scheduleReconnect(reason, Date.now() - connectedAt));
  await room.connect(url, token, { autoSubscribe: false });
  connectedAt = Date.now();
  for (let i = 0; i < 50 && !room.remoteParticipants.get('host'); i++) await new Promise(r => setTimeout(r, 100));
  hostP = room.remoteParticipants.get('host');
  if (!hostP) {
    listError = 'Connected, but the host is not in the room. Is Porthole Host running?';
    if (winId) overlay('failed', listError); else render();
    return;
  }
  setLink(null);
  if (winId) { openWindow(winId); send({ t: 'list' }); } else requestList();
}

function requestList() {
  listed = false;
  PC.retry(() => send({ t: 'list' }), () => listed, PC.RETRY.list.every, PC.RETRY.list.times);
}

function onData(payload, participant, kind, topic) {
  if (topic !== 'porthole' || !participant || participant.identity !== 'host') return;
  const m = JSON.parse(new TextDecoder().decode(payload));
  if (m.t === 'windows') { listed = true; gotList(m.list || []); }
  else if (m.t === 'opened' && m.win === winId && !opened) { opened = true; subscribe(m.track); if (PC.isAudioTrack(m.audio)) listen(m.audio); }
  else if (m.t === 'closed' && m.win === winId) overlay('closed');
  else if (m.t === 'control') {
    const was = controlling;
    controlling = !!m.on; asking = false; showGuest();
    if (m.msg) toast(m.msg, true);
    else if (controlling && !was) toast('You may type and click in this window now.');
    else if (!controlling && was) toast('Control was turned off. You can keep watching.', true);
  }
  else if (m.t === 'error') {
    if (winId && m.win === winId && !opened) overlay('failed', m.msg);
    else if (winId) toast(m.msg, true);
    else { listError = m.msg; render(); }
  }
}

function gotList(list) {
  windows = list;
  if (winId) {
    const w = list.find(x => x.id === winId);
    if (w) { $('wtitle').textContent = PC.portalTitle(w); document.title = `${PC.portalTitle(w)} · Porthole`; }
    return;
  }
  loaded = true;
  if (list.length) listError = null;
  for (const id of PC.staleIds(thumbs.keys(), list)) { URL.revokeObjectURL(thumbs.get(id)); thumbs.delete(id); }
  for (const id of PC.staleIds(icons.keys(), list)) { URL.revokeObjectURL(icons.get(id)); icons.delete(id); }
  render();
  if (list.length && live()) {
    send({ t: 'thumb' });
    for (const id of PC.iconRequests(list)) if (!icons.has(id)) send({ t: 'icon', win: id });
  }
}

function iconFor(w) {
  if (icons.has(w.id)) return icons.get(w.id);
  const twin = windows.find(x => x.app === w.app && icons.has(x.id));
  return twin ? icons.get(twin.id) : null;
}

function iconArrived(id) {
  const w = windows.find(x => x.id === id);
  if (!w) return;
  for (const x of windows) if (x.app === w.app) paintCard(x.id);
}

function render() {
  const shown = PC.filterWindows(windows, query);
  const n = PC.pickerNotice(loaded, windows.length, shown.length, query, listError);
  const notice = $('notice');
  notice.hidden = !n;
  if (n) {
    notice.className = `notice ${n.kind}`;
    const glyph = { locked: '\u{1F512}', error: '⚠︎', empty: '▢', nomatch: '⌕' }[n.kind];
    notice.innerHTML = n.kind === 'loading' ? '<div class="spinner"></div>' : `<div class="glyph">${glyph}</div>`;
    const h = document.createElement('h2'); h.textContent = n.title;
    const p = document.createElement('p'); p.textContent = n.message;
    notice.append(h, p);
    if (n.kind !== 'loading' && n.kind !== 'nomatch') {
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Refresh'; b.onclick = refresh;
      notice.append(b);
    }
  }
  $('searchbox').hidden = !windows.length;
  $('refresh').hidden = !loaded && !listError;
  const line = PC.statusLine(link, loaded, windows.length, shown.length);
  if (line) setStatus(line.text, line.state);
  const pw = sessionStorage.getItem('pw');
  $('list').replaceChildren(...shown.map(w => {
    const a = document.createElement('a');
    a.className = 'card'; a.target = '_blank'; a.dataset.id = w.id;
    a.href = share ? PC.guestWindowLink(share, w.id) : PC.windowLink(pw, w.id);
    a.title = PC.portalTitle(w);
    a.innerHTML = '<div class="shot"></div><div class="meta"><span class="blank"></span><div><b></b><span></span></div></div>';
    a.querySelector('b').textContent = w.title || w.app;
    a.querySelector('.meta div span').textContent = w.title ? `${w.app} · ${PC.sizeLabel(w.w, w.h)}` : PC.sizeLabel(w.w, w.h);
    fillCard(a, w);
    return a;
  }));
}

function fillCard(a, w) {
  const shot = a.querySelector('.shot');
  const icon = iconFor(w);
  const thumb = thumbs.get(w.id);
  shot.replaceChildren();
  if (thumb) { const i = new Image(); i.className = 'thumb'; i.alt = ''; i.src = thumb; shot.append(i); }
  else if (icon) { const i = new Image(); i.className = 'big'; i.alt = ''; i.src = icon; shot.append(i); }
  else if (PC.isScreen(w)) { const g = document.createElement('div'); g.className = 'glyph'; g.textContent = '\u{1F5A5}'; shot.append(g); }
  const slot = a.querySelector('.meta').firstElementChild;
  if (icon) { const i = new Image(); i.alt = ''; i.src = icon; slot.replaceWith(i); }
}

function paintCard(id) {
  const a = $('list').querySelector(`a[data-id="${id}"]`);
  const w = windows.find(x => x.id === id);
  if (a && w) fillCard(a, w);
}

function refresh() {
  loaded = false; listError = null; render();
  requestList();
}
$('refresh').addEventListener('click', refresh);
$('q').addEventListener('input', e => { query = e.target.value; render(); });
setInterval(() => { if (!winId && live() && windows.length && document.visibilityState === 'visible') send({ t: 'thumb' }); }, 5000);
window.addEventListener('keydown', e => {
  if (winId || e.target.tagName === 'INPUT') return;
  if (e.key === '/' || (e.key === 'f' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'r' && !e.metaKey && !e.ctrlKey) refresh();
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const first = $('list').querySelector('a'); if (first) first.click(); }
  if (e.key === 'Escape') { e.target.value = ''; query = ''; render(); }
});

const phases = {
  opening: () => ['Opening window…', 'Waiting for the first picture from the host.', true],
  reconnecting: () => ['Reconnecting…', 'The connection to the host dropped. The picture comes back when it reconnects.', true],
  disconnected: () => ['Disconnected', 'The connection to the host ended.', false],
  closed: () => ['Window Closed', 'The window was closed on the host.', false],
  failed: (why) => ["Can't Open This Window", why || 'The host did not answer.', false],
};
let phase = null;
function overlay(kind, why) {
  phase = kind;
  $('overlay').classList.toggle('on', !!kind);
  if (!kind) return;
  const [title, text, busy] = phases[kind](why);
  $('otitle').textContent = title; $('otext').textContent = text;
  $('ospin').hidden = !busy;
  $('oacts').hidden = busy;
  $('oretry').textContent = kind === 'closed' ? 'Reload' : 'Try Again';
}
$('oretry').addEventListener('click', () => location.reload());

function openWindow(id) {
  $('picker').style.display = 'none';
  $('stage').style.display = 'block';
  overlay('opening');
  showBar(4000);
  PC.retry(() => send({ t: 'open', win: id, sw: screen.width, sh: screen.height, ss: devicePixelRatio }), () => opened, PC.RETRY.open.every, PC.RETRY.open.times);
  setTimeout(() => { if (!firstFrame && phase === 'opening') overlay('failed', 'No picture arrived from the host. It may be busy, asleep or locked.'); }, 20000);
}

function subscribe(trackName) {
  const tryNow = () => {
    const pub = [...hostP.trackPublications.values()].find(p => p.trackName === trackName);
    if (!pub) return false;
    pub.setSubscribed(true);
    return true;
  };
  room.on(LK.RoomEvent.TrackSubscribed, (track, pub) => {
    if (pub.trackName !== trackName) return;
    track.attach($('video'));
    $('video').focus();
    watchRoute(track);
  });
  if (!tryNow()) room.on(LK.RoomEvent.TrackPublished, () => tryNow());
}
let routeTrack = null, routeTimer = null, routeText = '';
async function routeReport(track) {
  try { if (track.getRTCStatsReport) { const r = await track.getRTCStatsReport(); if (r) return r; } } catch (e) {}
  try {
    const pc = room.engine && room.engine.pcManager && room.engine.pcManager.subscriber;
    if (pc && pc.getStats) return await pc.getStats();
  } catch (e) {}
  return null;
}
function watchRoute(track) {
  routeTrack = track;
  clearTimeout(routeTimer);
  const tick = async () => {
    if (routeTrack !== track) return;
    const r = PC.selectedRoute(await routeReport(track));
    if (r && r.text !== routeText) {
      routeText = r.text;
      $('route').textContent = '· ' + r.label;
      $('route').title = 'Connection: ' + r.text;
      $('route').hidden = false;
      console.info('route: ' + r.text);
    }
    routeTimer = setTimeout(tick, r ? 15000 : 2000);
  };
  routeTimer = setTimeout(tick, 1000);
}
$('video').addEventListener('loadeddata', () => {
  firstFrame = true;
  if (phase === 'opening' || phase === 'reconnecting') overlay(null);
  toast(PC.guestNotice(guest, controlling), !!guest && !controlling);
});

const allowed = () => PC.mayInput(guest, controlling);
function viewOnly() {
  showBar(5000);
  toast(asking ? 'Waiting for the host to answer.' : 'View only. Choose Ask to Control to type and click.');
}
function showGuest() {
  const b = PC.askButton(guest, controlling, asking);
  $('ask').style.display = b.show ? 'inline-block' : 'none';
  $('ask').textContent = b.text;
  $('ask').disabled = b.disabled;
  $('fit').style.display = allowed() ? '' : 'none';
  if (b.show) showBar(6000);
}
$('ask').addEventListener('click', e => {
  e.stopPropagation();
  if (!room || controlling || asking) return;
  asking = true; showGuest();
  send({ t: 'ask', win: winId });
  toast('Asked the host. You can keep watching meanwhile.');
  video.focus();
});

let barTimer;
function showBar(ms = 2500) {
  $('bar').classList.remove('hidden');
  clearTimeout(barTimer);
  barTimer = setTimeout(() => { if (!$('bar').matches(':hover')) $('bar').classList.add('hidden'); }, ms);
}
$('bar').addEventListener('pointerleave', () => showBar(1200));
function toggleBar() {
  if ($('bar').classList.contains('hidden')) showBar(4000);
  else { clearTimeout(barTimer); $('bar').classList.add('hidden'); }
}
window.addEventListener('pointermove', e => { if (winId && e.clientY < 40) showBar(); });

let soundMuted = false;
const audioEls = new Set();
function listen(trackName) {
  const tryNow = (pub) => { if (pub && pub.trackName === trackName) pub.setSubscribed(true); };
  room.on(LK.RoomEvent.TrackPublished, tryNow);
  room.on(LK.RoomEvent.TrackSubscribed, (track, pub) => {
    if (pub.trackName !== trackName) return;
    const el = track.attach();
    el.muted = soundMuted;
    audioEls.add(el);
    document.body.appendChild(el);
    showSound();
  });
  room.on(LK.RoomEvent.TrackUnsubscribed, (track, pub) => {
    if (pub.trackName !== trackName) return;
    for (const el of track.detach()) { audioEls.delete(el); el.remove(); }
    showSound();
  });
  for (const pub of hostP.trackPublications.values()) tryNow(pub);
}
function showSound() {
  const b = $('snd');
  b.style.display = audioEls.size ? 'inline-block' : 'none';
  b.textContent = PC.soundLabel(room.canPlaybackAudio, soundMuted);
  b.classList.toggle('ask', !room.canPlaybackAudio);
  if (!room.canPlaybackAudio && audioEls.size) showBar(6000);
}
function unlockSound() {
  if (room && audioEls.size && !room.canPlaybackAudio) room.startAudio().then(showSound, () => {});
}
$('snd').addEventListener('click', e => {
  e.stopPropagation();
  if (room.canPlaybackAudio) { soundMuted = !soundMuted; for (const el of audioEls) el.muted = soundMuted; }
  unlockSound();
  showSound();
  video.focus();
});

let toastTimer;
function toast(text, sticky) {
  const t = $('toast'); t.textContent = text; t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = 0, sticky ? 6000 : 2500);
}

const geom = () => { const v = $('video'); return { rect: v.getBoundingClientRect(), vw: v.videoWidth, vh: v.videoHeight }; };
function norm(e, clamp) {
  const g = geom();
  return PC.norm(e.clientX, e.clientY, g.rect, g.vw, g.vh, clamp);
}

const video = $('video');
const pointer = PC.createPointer(winId, isMac);
video.addEventListener('contextmenu', e => e.preventDefault());
video.addEventListener('pointerdown', e => {
  unlockSound();
  if (!allowed()) { viewOnly(); return; }
  const out = pointer.down(e, geom(), performance.now()); if (!out) return;
  video.focus(); video.setPointerCapture(e.pointerId);
  send(out.msg, out.reliable);
  e.preventDefault();
});
function pointerUp(e) {
  if (!allowed()) return;
  const out = pointer.up(e, geom()); if (out) send(out.msg, out.reliable);
}
video.addEventListener('pointerup', e => { pointerUp(e); if (e.pointerType === 'touch') toggleBar(); });
video.addEventListener('pointercancel', pointerUp);
video.addEventListener('pointermove', e => {
  if (!allowed()) return;
  const out = pointer.move(e, geom(), performance.now()); if (out) send(out.msg, out.reliable);
});
video.addEventListener('wheel', e => {
  if (!allowed()) return;
  const p = norm(e); if (!p) return;
  const { dx, dy } = PC.scrollDelta(e);
  send({ t: 'scroll', win: winId, x: p.x, y: p.y, dx, dy });
  e.preventDefault();
}, { passive: false });

const swallowedUp = new Set();
function onKey(e, down) {
  if (!winId || !room) return;
  if (down) unlockSound();
  if (!allowed()) { if (down && !e.repeat && !e.metaKey && !e.ctrlKey) viewOnly(); return; }
  const r = PC.keyMessages(e, down, isMac, winId, swallowedUp);
  if (r.prevent) e.preventDefault();
  for (const m of r.send) send(m);
}
window.addEventListener('keydown', e => onKey(e, true));
window.addEventListener('keyup', e => onKey(e, false));
let hostClip = null;
async function clipFromHost(text) {
  if (!PC.clipFits(text)) return;
  hostClip = text;
  try { await navigator.clipboard.writeText(text); toast('Copied from the Mac.'); return; } catch (_) {}
  $('clip').style.display = 'inline-block';
  showBar(6000);
  toast('The Mac copied something. Click "Copy here" to get it on this computer.', true);
}
$('clip').addEventListener('click', e => {
  e.stopPropagation();
  const ta = document.createElement('textarea');
  ta.value = hostClip || ''; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  const ok = document.execCommand('copy');
  ta.remove();
  $('clip').style.display = 'none';
  toast(ok ? 'Copied to this computer.' : 'Copy failed.');
  video.focus();
});
window.addEventListener('paste', async e => {
  if (!winId || !allowed()) return;
  e.preventDefault();
  const s = e.clipboardData.getData('text');
  if (!room || !PC.clipFits(s)) return;
  if (s !== hostClip) {
    await room.localParticipant.sendText(s, { topic: PC.CLIP_TOPIC, destinationIdentities: ['host'] });
    hostClip = s;
    await new Promise(r => setTimeout(r, 150));
  }
  for (const m of PC.pasteKeys(winId)) send(m);
});

if (PC.isScreenId(winId)) $('fit').hidden = true;
function fitToTab() { if (winId && room && allowed()) { send({ t: 'resize', win: winId, w: innerWidth, h: innerHeight }); toast('Resized the window to fit this tab.'); } }
$('fit').addEventListener('click', e => { e.stopPropagation(); fitToTab(); video.focus(); });

function showPassword(msg) {
  $('notice').hidden = true;
  if (msg) $('pwhint').textContent = msg;
  setLink('Not connected');
  $('pwform').hidden = false;
  $('pw').focus();
}
$('pwform').addEventListener('submit', e => { e.preventDefault(); $('pwform').hidden = true; $('notice').hidden = false; connect($('pw').value); });

const pw = share ? null : params.get('pw') || sessionStorage.getItem('pw');
if (share || pw) connect(pw).catch(err => {
  if (sessionStorage.getItem('reconnects')) scheduleReconnect(0, 0);
  else if (share) { listError = 'Could not connect: ' + err.message; if (winId) overlay('failed', listError); else render(); }
  else showPassword('Could not connect: ' + err.message);
}); else showPassword();
</script>
</body>
</html>
